# Render Blueprint for the API. The database is on Neon and the frontend on Vercel (see docs/OPERATIONS.md > Deploy).
# Render dashboard -> New -> Blueprint -> pick this repo. Then fill the "sync: false" values.
services:
  - type: web
    name: bookleaf-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # The seed is idempotent: creates the schema on an empty database, upserts the 10 authors
    # and 18 books from data/bookleaf_sample_data.json, and never overwrites tickets.
    # --forwarded-allow-ips='*' so rate limits see the visitor's IP (see docs/OPERATIONS.md, Security).
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false # Neon connection string
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false # the Vercel URL, e.g. https://bookleaf-author-support-coral.vercel.app
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_CLASSIFY_MODEL
        sync: false
      - key: GEMINI_THINKING_LEVEL
        value: low
